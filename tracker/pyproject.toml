[project]
name = "utsushimirror-tracker"
version = "0.1.0"
description = "うつしみらー (UtsushiMirror) の Web カメラトラッカー (MediaPipe → VMC)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe>=0.10.20",
    "opencv-python>=4.9",
    "numpy",
    "cv2-enumerate-cameras",
    "websockets",
]

[tool.uv]
# スクリプトとして動かすだけなので、パッケージとしてはインストールしない
package = false
