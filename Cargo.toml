[workspace]
resolver = "3"
members = [
    "rust/vrm-protocol",
    "rust/vrm-vrma-gen",
    "rust/vrm-gdext",
    "rust/vrm-cli",
    "rust/vrm-mcp",
]

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "MIT"
authors = ["VRMViewer Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rosc = "0.11"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = "0.30"
tungstenite = "0.30"
futures-util = "0.3"
crossbeam-channel = "0.5"
clap = { version = "4.6", features = ["derive"] }
base64 = "0.23"
thiserror = "2.0"
anyhow = "1.0"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis", "flac", "isomp4", "aac", "mkv"] }
rustfft = "6"
godot = { version = "0.5.5", features = ["api-4-7"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
] }
